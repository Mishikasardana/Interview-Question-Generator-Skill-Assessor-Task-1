[pytest]
testpaths =
    answer_evaluation/tests
    api/tests
    database/tests
    jd_parsing/tests
    matching_engine/tests
    question_generation/tests
    recruiter_intelligence/tests
    resume_processing/tests
    semantic_matching/tests
    speech_to_text/tests
    tests
addopts = -ra --strict-markers
markers =
    integration: requires PostgreSQL (set TEST_DATABASE_URL)
    e2e: full cross-module flows
    slow: tests that take more than a few seconds
filterwarnings =
    ignore::DeprecationWarning:speech_recognition.*
